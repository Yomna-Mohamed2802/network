<style>
:root{--bg:#fff;--panel:#fff;--fg:#1f2328;--muted:#59636e;--line:#d1d9e0;--k:#0969da;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--panel:#151b23;--fg:#f0f6fc;--muted:#9198a1;--line:#3d444d;--k:#4493f8;color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 "Plus Jakarta Sans","Tajawal",system-ui,sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:8px}
h1{margin:0;font-weight:800;letter-spacing:-.02em;font-size:1.8rem}
header p{margin:.3rem 0 0;color:var(--muted)}
.back{display:inline-block;margin-bottom:10px;color:var(--k);text-decoration:none;font-weight:600}
h2{font-size:1.05rem;margin:24px 0 10px;border-left:4px solid var(--k);padding-left:10px}
.ar{font-family:"Tajawal",Tahoma,sans-serif;direction:rtl;color:var(--muted);font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
figure{margin:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.im{background:#fff;height:110px;display:grid;place-items:center;border-bottom:1px solid var(--line);padding:10px}
.im img{max-height:88px;max-width:100%;object-fit:contain}
figcaption{padding:10px 12px;display:grid;gap:3px;font-size:.86rem}
figcaption b{font-size:.95rem}
figcaption .ar{text-align:right;display:block}
</style>
